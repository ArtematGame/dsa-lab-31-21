<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>

<h1>Вход</h1>

{% if message %}
    <p><b>{{ message }}</b></p>
{% endif %}

<form method="post" action="/login">

    <p>Логин</p>
    <input type="text" name="login">

    <p>Пароль</p>
    <input type="password" name="password">

    <br><br>

    <button type="submit">Войти</button>

</form>

<br>

<a href="/register">Нет аккаунта? Зарегистрироваться</a>
<br>
<a href="/">На главную</a>

</body>
</html>
