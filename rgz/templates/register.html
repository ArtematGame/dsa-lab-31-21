<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
</head>
<body>

<h1>Регистрация</h1>

{% if message %}
    <p><b>{{ message }}</b></p>
{% endif %}

<form method="post" action="/reg">

    <p>Логин</p>
    <input type="text" name="login">

    <p>Пароль</p>
    <input type="password" name="password">

    <br><br>

    <button type="submit">Зарегистрироваться</button>

</form>

<br>

<a href="/login">Уже есть аккаунт? Войти</a>
<br>
<a href="/">На главную</a>

</body>
</html>
